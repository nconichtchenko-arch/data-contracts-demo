name: Data Contract Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install pyyaml
        
    - name: Validate YAML syntax
      run: |
        python -c "import yaml; yaml.safe_load(open('contracts/fct_sales_contract.yml')); print('✅ YAML контракт валиден')"
